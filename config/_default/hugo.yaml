baseURL: "https://clubalgoritmiaus.es"
title: Club de Algoritmia de la Universidad de Sevilla
defaultContentLanguage: es
defaultContentLanguageInSubdir: false
disableLanguages: []

languages:
  es:
    label: Español
    weight: 1
    params:
      description:
        "Club de Algoritmia de la Universidad de Sevilla: charlas, competiciones de programación y
        una comunidad abierta para aprender algoritmia."
  en:
    label: English
    weight: 2
    taxonomies: {}
    params:
      description:
        "Algorithm Club of the University of Seville: talks, programming contests and an open
        community for learning algorithms."

# General site settings
enableEmoji: true
enableInlineShortcodes: true
enableRobotsTXT: true

pagination:
  pagerSize: 9

# Site parameters
params:
  title_short: CAUS
  author: Club Algoritmia de la Universidad de Sevilla
  og_image: /images/global/logo-caus.webp
  theme_color: "#ffffff"

  disable_theme_toggle: false

  p1:
    image: "images/home/complicaus-5.webp"

  p2:
    image: "images/home/roco.webp"

  p3:
    logos:
      - identifier: a
        image: "images/global/logo-nd.webp"
        alt: "Logo de Next Digital"
      - identifier: b
        image: "images/global/logo-etsii-color.webp"
        alt:
          "Logo de la Escuela Técnica Superior de Ingeniería Informática de la Universidad de
          Sevilla"

  social_media:
    github:
      enabled: true
      url: "https://github.com/algoritmiaUS"

    linkedin:
      enabled: true
      url: "https://linkedin.com/company/club-de-algoritmia-universidad-de-sevilla"

    whatsapp:
      enabled: true
      url: "https://chat.whatsapp.com/DFm3DnLHbGn4vWimWN1Wmc"

    instagram:
      enabled: true
      url: "https://instagram.com/clubalgoritmiaus"

    twitter:
      enabled: true
      url: "https://x.com/algoritmiaus"

    youtube:
      enabled: true
      url: "https://www.youtube.com/@ClubAlgoritmiaUS"

# Content
taxonomies:
  category: Categories
  tag: Tags

# Markdown
markup:
  goldmark:
    renderer:
      unsafe: true

# Minify
minify:
  tdewolff:
    html:
      keepQuotes: true

# Hugo modules
module:
  hugoVersion:
    extended: true
    min: "0.165.0"

# Security
security:
  exec:
    allow:
      - "^tailwindcss$"
      - "^node$"
