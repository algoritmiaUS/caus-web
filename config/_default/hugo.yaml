baseURL: "https://clubalgoritmiaus.es"
title: Club de Algoritmia de la Universidad de Sevilla
defaultContentLanguage: es
defaultContentLanguageInSubdir: false
disableLanguages: []

languages:
  es:
    label: Español
    weight: 1
    params:
      description:
        "Club de Algoritmia de la Universidad de Sevilla: charlas, competiciones de programación y
        una comunidad abierta para aprender algoritmia."
  en:
    label: English
    weight: 2
    taxonomies: {}
    params:
      description:
        "Algorithm Club of the University of Seville: talks, programming contests and an open
        community for learning algorithms."

# General site settings
enableEmoji: true
enableInlineShortcodes: true
enableRobotsTXT: true

pagination:
  pagerSize: 9

# Site parameters
params:
  social_media:
    github: "https://github.com/algoritmiaUS"
    linkedin: "https://linkedin.com/company/club-de-algoritmia-universidad-de-sevilla"
    whatsapp: "https://chat.whatsapp.com/DFm3DnLHbGn4vWimWN1Wmc"
    instagram: "https://instagram.com/clubalgoritmiaus"
    twitter: "https://x.com/algoritmiaus"
    youtube: "https://www.youtube.com/@ClubAlgoritmiaUS"

# Content
taxonomies:
  category: Categories
  tag: Tags

# Markdown
markup:
  goldmark:
    renderer:
      unsafe: true

# Minify
minify:
  tdewolff:
    html:
      keepQuotes: true

# Hugo modules
module:
  hugoVersion:
    extended: true
    min: "0.165.0"

# Security
security:
  exec:
    allow:
      - "^tailwindcss$"
      - "^node$"
