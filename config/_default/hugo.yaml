baseURL: "https://clubalgoritmiaus.es"
title: Club de Algoritmia de la Universidad de Sevilla
defaultContentLanguage: es
defaultContentLanguageInSubdir: false
disableLanguages: []

languages:
  es:
    label: Español
    weight: 1
  en:
    label: English
    weight: 2

# General site settings
enableEmoji: true
enableGitInfo: true
enableInlineShortcodes: true
enableRobotsTXT: true
canonifyURLs: true

pagination:
  pagerSize: 9

# Site parameters
params:
  title_short: CAUS
  author: Club Algoritmia de la Universidad de Sevilla
  heropic: /images/pages/logo_CAUS.webp
  og_image: /images/logo-CAUS.webp
  theme_color: "#ffffff"

  disable_theme_toggle: false
  disable_stay_uptodate: false

  p1:
    image: "images/pages/complicaus-5.webp"

  p2:
    image: "images/pages/roco.webp"

  p3:
    logos:
      - identifier: a
        image: "images/global/Logo_ND.webp"
        alt: "a"
      - identifier: b
        image: "images/global/logo-ETSII-Color.webp"
        alt: "b"

  social_media:
    github:
      enabled: true
      url: "https://github.com/algoritmiaUS"

    linkedin:
      enabled: true
      url: "https://linkedin.com/company/club-de-algoritmia-universidad-de-sevilla"

    whatsapp:
      enabled: true
      url: "https://chat.whatsapp.com/DFm3DnLHbGn4vWimWN1Wmc"

    instagram:
      enabled: true
      url: "https://instagram.com/clubalgoritmiaus"

    twitter:
      enabled: true
      url: "https://x.com/algoritmiaus"

    youtube:
      enabled: true
      url: "https://www.youtube.com/@ClubAlgoritmiaUS"

# Content
taxonomies:
  category: Categories
  tag: Tags

# Markdown
markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: https
      strikethrough: true
      table: true
      taskList: true

      typographer:
        apostrophe: "&rsquo;"
        disable: false
        ellipsis: "&hellip;"
        emDash: "&mdash;"
        enDash: "&ndash;"
        leftAngleQuote: "&laquo;"
        leftDoubleQuote: "&ldquo;"
        leftSingleQuote: "&lsquo;"
        rightAngleQuote: "&raquo;"
        rightDoubleQuote: "&rdquo;"
        rightSingleQuote: "&rsquo;"

    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: github
      wrapStandAloneImageWithinParagraph: true

    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

# Privacy
privacy:
  disqus:
    disable: false

  googleAnalytics:
    anonymizeIP: true
    disable: false
    respectDoNotTrack: false
    useSessionStorage: false

  instagram:
    disable: false
    simple: false

  twitter:
    disable: false
    enableDNT: false
    simple: false

  vimeo:
    disable: false
    enableDNT: false
    simple: false

  youtube:
    privacyEnhanced: true
    disable: false

# Hugo modules
module:
  hugoVersion:
    extended: true
    min: "0.165.0"

# Security
security:
  exec:
    allow:
      - "^git"
      - "^tailwindcss$"
      - "^node$"
