# Validates that the site builds and is formatted on every pull request.
name: PR checks

on:
  pull_request:

# Sets permissions of the GITHUB_TOKEN to allow reading the repository
permissions:
  contents: read

# Cancel in-progress runs when a new commit is pushed to the PR
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUGO_VERSION: 0.165.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Build
        run: bun run build
