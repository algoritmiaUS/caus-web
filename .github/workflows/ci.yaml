name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Format, images & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ vars.HUGO_VERSION }}
          extended: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ vars.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check image formats
        run: |
          forbidden_files=$(
            find . \
              -type f \
              \( \
                -iname '*.jpg' \
                -o -iname '*.jpeg' \
                -o -iname '*.png' \
                -o -iname '*.gif' \
                -o -iname '*.bmp' \
                -o -iname '*.tiff' \
                -o -iname '*.ico' \
              \) \
              -not -path './.git/*'
          )

          if [[ -n "$forbidden_files" ]]; then
            echo "::error::Only .webp and .svg images are allowed."
            echo
            echo "Run: bun convert"
            exit 1
          fi

          echo "Image format check passed."

      - name: Format check
        run: bun run format:check

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: bun run build
