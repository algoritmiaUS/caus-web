{{ range . }}
  <li class="flex">
    <a
      class="grow px-4 py-2 mt-2 text-sm font-semibold rounded-lg lg:mt-0 hover:text-paper focus-visible:text-paper hover:bg-accent/85 focus-visible:bg-accent/85 focus-ring"
      href="{{ .URL | relLangURL }}"
      title="{{ .Title | default .Name }}"
    >
      {{ .Name }}
    </a>
  </li>
{{ end }}
