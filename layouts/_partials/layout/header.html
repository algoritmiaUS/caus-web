<header
  class="top-0 z-50 flex w-full flex-col max-w-full px-4 py-4 mx-auto text-paper bg-ink sticky lg:items-center lg:justify-between lg:flex-row lg:px-8"
>
  <div class="flex flex-row items-center justify-between">
    <a
      href="{{ "/" | relLangURL }}"
      class="flex text-paper transition duration-1000 ease-in-out group"
    >
      <img
        src="{{ "images/global/logo-caus.webp" | relURL }}"
        class="transition-opacity h-9 w-9 group-hover:opacity-50 group-focus:opacity-70"
        alt="{{ site.Title }} Logo"
      />
      <span
        class="mt-1 ml-3 text-xl font-black tracking-tight text-paper uppercase transition-colors group-hover:text-paper/60"
        >CAUS</span
      >
    </a>
    <button
      id="menu-toggle"
      type="button"
      class="rounded-lg p-1 text-paper lg:hidden hover:bg-accent/85 focus-ring"
      aria-expanded="false"
      aria-controls="menuItems"
      aria-label="Main"
    >
      {{ partial "components/svg.html" (dict "name" "menu" "class" "w-6 h-6" "id" "menu-icon-open") }}
      {{ partial "components/svg.html" (dict "name" "close" "class" "hidden w-6 h-6" "id" "menu-icon-close") }}
    </button>
  </div>
  <nav
    id="menuItems"
    class="flex-col grow hidden pb-4 lg:pb-0 lg:flex lg:justify-end lg:flex-row"
    aria-label="Main"
  >
    <ul class="flex flex-col grow lg:flex-row lg:justify-end lg:items-center">
      {{ partial "layout/menu-items.html" site.Menus.main }}
      {{ partial "layout/lang-switcher.html" . }}
      <li class="flex items-center">
        <button
          id="theme-toggle"
          type="button"
          class="flex grow justify-start lg:justify-center text-left lg:text-center px-4 py-2 mt-2 text-sm text-paper/80 rounded-lg lg:mt-0 lg:ml-2 hover:text-paper hover:bg-accent/85 focus-visible:outline-hidden focus-visible:ring-2 focus-visible:ring-accent transition-colors"
          aria-label="{{ i18n "header.theme-toggle" }}"
        >
          {{ partial "components/svg.html" (dict "name" "moon" "class" "hidden w-5 h-5" "id" "theme-toggle-dark-icon") }}
          {{ partial "components/svg.html" (dict "name" "sun" "class" "hidden w-5 h-5" "id" "theme-toggle-light-icon") }}
        </button>
      </li>
    </ul>
  </nav>
</header>
