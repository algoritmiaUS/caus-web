<section class="bg-wash">
  <div class="container-page grid items-center gap-12 py-16 sm:py-20 lg:grid-cols-12">
    <div class="text-center lg:col-span-6 lg:text-left">
      <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-fg md:text-5xl xl:text-6xl">
        CAUS
      </h1>
      <p class="mt-2 text-2xl font-light text-muted md:text-3xl">
        {{ i18n "hero.moto" }}
      </p>
      <p class="mx-auto mt-6 max-w-xl text-lg text-fg lg:mx-0">
        {{ i18n "hero.description" }}
      </p>
      <div
        class="mt-8 flex flex-col items-center gap-3 sm:flex-row sm:justify-center lg:justify-start"
      >
        <a
          href="{{ site.Params.social_media.whatsapp }}"
          class="btn-primary w-full sm:w-auto"
          target="_blank"
          rel="noopener noreferrer"
        >
          {{ i18n "hero.whatsapp" }}
        </a>
      </div>
    </div>
    <div class="flex justify-center lg:col-span-6">
      <img
        src="/images/global/logo-caus.webp"
        class="w-full h-auto max-w-xl mx-auto rounded-lg"
        alt="CAUS logo"
        width="576"
        height="576"
        decoding="async"
        fetchpriority="high"
      />
    </div>
  </div>
</section>
