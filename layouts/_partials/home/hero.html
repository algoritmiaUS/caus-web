<section class="bg-wash">
  <div class="container-page section-padding grid items-center gap-12 lg:grid-cols-12">
    <div class="text-center lg:col-span-6 lg:text-left">
      <h1 class="mt-3 text-4xl font-extrabold tracking-tight text-fg md:text-5xl xl:text-6xl">
        CAUS
      </h1>
      <p class="mt-2 text-2xl font-light text-muted md:text-3xl">
        {{ i18n "hero.moto" }}
      </p>
      <p class="mx-auto mt-6 max-w-xl text-lg text-fg lg:mx-0">
        {{ i18n "hero.description" }}
      </p>
      <form
        action="{{ site.Params.whatsapp_gate.action }}"
        method="POST"
        class="mt-8 flex flex-col items-center gap-4 sm:flex-row sm:justify-center lg:justify-start"
      >
        <div
          class="cf-turnstile"
          data-sitekey="{{ site.Params.whatsapp_gate.turnstile_sitekey }}"
          data-theme="auto"
        ></div>
        <button type="submit" class="btn-primary w-full sm:w-auto">
          {{ i18n "hero.whatsapp" }}
        </button>
      </form>
    </div>
    <div class="flex justify-center lg:col-span-6">
      <img
        src="{{ "images/global/logo-caus.webp" | relURL }}"
        class="w-full h-auto max-w-xl mx-auto rounded-lg"
        alt="CAUS logo"
        width="576"
        height="576"
        decoding="async"
        fetchpriority="high"
      />
    </div>
  </div>
</section>
