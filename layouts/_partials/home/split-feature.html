{{ $key := .key }}
{{ $heading := partial "components/section-heading.html" (dict
  "title" (i18n (printf "%s.heading" $key)) "subtitle" (i18n (printf "%s.description" $key)))
}}
<section id="{{ $key }}" class="{{ .class }}">
  <div class="container-page grid items-start gap-12 lg:grid-cols-2 lg:gap-16">
    {{ if not .imageFirst }}{{ $heading }}{{ end }}
    <img
      src="{{ .image | relURL }}"
      class="h-auto w-full rounded-2xl shadow-xl"
      alt="{{ i18n (printf "%s.image_alt" $key) }}"
      loading="lazy"
      decoding="async"
    />
    {{ if .imageFirst }}{{ $heading }}{{ end }}
  </div>
</section>
