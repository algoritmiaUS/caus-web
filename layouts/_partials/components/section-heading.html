{{ $center := .center | default false }}
<div class="{{ if $center }}mx-auto text-center{{ end }} max-w-2xl">
  <h2 class="mt-2 text-3xl font-bold tracking-tight text-fg sm:text-4xl">
    {{ .title }}
  </h2>
  {{ with .subtitle }}
    <p class="mt-4 text-lg leading-7 text-muted">{{ . }}</p>
  {{ end }}
</div>
