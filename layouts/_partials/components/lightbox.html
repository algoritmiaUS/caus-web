{{ $lightbox := resources.Get "js/lightbox.js" | js.Build | minify | fingerprint }}
<script src="{{ $lightbox.RelPermalink }}" defer></script>
<dialog
  id="lightbox"
  aria-label="Imagen"
  class="m-auto bg-transparent p-4 opacity-0 transition-opacity duration-200 outline-hidden open:opacity-100 starting:open:opacity-0 backdrop:bg-ink/60 backdrop:backdrop-blur-sm"
>
  <div class="max-h-[90vh] max-w-4xl rounded-xl bg-surface p-5 shadow-2xl">
    <img
      id="lightbox-image"
      alt=""
      class="mx-auto block h-auto max-h-[calc(90vh-2.5rem)] max-w-full rounded-md"
    />
  </div>
</dialog>
