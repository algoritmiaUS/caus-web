<section class="bg-white py-16 dark:bg-space-indigo/20 sm:py-24">
  <div
    class="mx-auto grid w-full max-w-7xl items-start gap-12 px-4 sm:px-6 lg:grid-cols-2 lg:gap-16 lg:px-8"
  >
    {{ partial "components/section-heading.html" (dict "title" (i18n "challenge.heading") "subtitle" (i18n "challenge.description")) }}
    <div class="overflow-hidden rounded-2xl shadow-xl">
      {{ $p2image := resources.Get site.Params.P2.Image }}
      {{ with $p2image }}
        <img
          src="{{ .RelPermalink }}"
          width="{{ .Width }}"
          height="{{ .Height }}"
          class="h-auto w-full"
          alt="{{ i18n "challenge.image_alt" }}"
          loading="lazy"
          decoding="async"
        />
      {{ end }}
    </div>
  </div>
</section>
