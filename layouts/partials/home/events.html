{{/* Latest news / events section */}}
<section class="bg-gray-200 py-16 dark:bg-gray-900/50 sm:py-24">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="text-center">
            <h2 class="text-3xl font-black tracking-tight text-primary-500 dark:text-primary-300 sm:text-4xl">
                {{ i18n "events.heading" }}
            </h2>
            <p class="mx-auto mt-3 max-w-2xl text-xl text-gray-500 dark:text-gray-300 sm:mt-4">
                {{ i18n "events.description" }}
            </p>
        </div>

        <div class="mx-auto mt-12 mb-4 grid gap-4 md:max-w-none md:grid-cols-3">
            {{ range (first 3 (where site.RegularPages "Section" "news")).ByDate.Reverse }}
            {{ partial "components/post-card.html" . }}
            {{ end }}
        </div>
    </div>
</section>
