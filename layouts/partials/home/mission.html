{{/* Our mission section */}}
<section id="mission" class="py-16 sm:py-24">
    <div class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
        <div class="grid items-start gap-12 lg:grid-cols-2 lg:gap-16">
            <div class="order-1">
                {{ partial "section-heading.html" (dict "title" (i18n "mission.heading") "subtitle" (i18n "mission.description")) }}
            </div>
            <div class="order-2">
                <div class="overflow-hidden rounded-2xl shadow-xl">
                    {{ $p1image := resources.Get site.Params.P1.Image }}
                    {{ with $p1image }}
                    {{ with .Resize (printf "%dx%d webp q90" .Width .Height) }}
                    <img src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}"
                         class="h-auto w-full" alt="P1" loading="lazy" decoding="async" />
                    {{ end }}
                    {{ end }}
                </div>
            </div>
        </div>
    </div>
</section>
