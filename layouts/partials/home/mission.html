<section id="mission" class="py-16 sm:py-24">
  <div
    class="mx-auto grid w-full max-w-7xl items-start gap-12 px-4 sm:px-6 lg:grid-cols-2 lg:gap-16 lg:px-8"
  >
    <div class="overflow-hidden rounded-2xl shadow-xl">
      {{ $p1image := resources.Get site.Params.P1.Image }}
      {{ with $p1image }}
        <img
          src="{{ .RelPermalink }}"
          width="{{ .Width }}"
          height="{{ .Height }}"
          class="h-auto w-full"
          alt="{{ i18n "mission.image_alt" }}"
          loading="lazy"
          decoding="async"
        />
      {{ end }}
    </div>
    {{ partial "components/section-heading.html" (dict "title" (i18n "mission.heading") "subtitle" (i18n "mission.description")) }}
  </div>
</section>
