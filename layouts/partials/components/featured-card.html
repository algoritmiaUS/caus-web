{{- $page := . -}}
{{ with $page.Params.featured_image }}
  {{ with resources.Get . }}
    {{ $postimage
      := (.Resize "500x webp q90").RelPermalink
    }}
    <img
      src="{{ $postimage }}"
      class="aspect-[3/2] w-full object-cover"
      width="500"
      height="333"
      loading="lazy"
      decoding="async"
      alt="{{ $page.Title }}"
    />
  {{ end }}
{{ end }}
