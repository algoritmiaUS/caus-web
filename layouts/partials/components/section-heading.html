{{ $center := .center | default false }}
<div class="{{ if $center }}mx-auto text-center{{ end }} max-w-2xl">
  {{ with .eyebrow }}
  <p class="text-sm font-semibold uppercase tracking-wider text-primary-500 dark:text-primary-300">
    {{ . }}
  </p>
  {{ end }}
  <h2 class="mt-2 text-3xl font-bold tracking-tight text-gray-900 dark:text-gray-50 sm:text-4xl">
    {{ .title }}
  </h2>
  {{ with .subtitle }}
  <p class="mt-4 text-lg leading-7 text-gray-600 dark:text-gray-300">{{ . }}</p>
  {{ end }}
</div>
