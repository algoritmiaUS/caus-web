{{- $page := . -}}
{{ with $page.Params.featured_image }}
  {{ with resources.Get . }}
    <img
      src="{{ .RelPermalink }}"
      srcset="
        {{- with .Resize "550x webp q80" -}}{{ .RelPermalink }} 550w,{{- end -}}
        {{ .RelPermalink }} {{ .Width }}w"
      class="object-fill overflow-hidden rounded-lg shadow-lg ring-4 ring-pale-slate/40 dark:ring-shadow-grey/40"
      width="100%"
      alt="{{ $page.Title }}"
    />
  {{ end }}
{{ end }}
