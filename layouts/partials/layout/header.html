<header class="top-0 z-50 w-full text-gray-200 bg-gray-900 sticky">
    <div class="flex flex-col max-w-full px-4 py-4 mx-auto lg:items-center lg:justify-between lg:flex-row lg:px-8">
        <div class="flex flex-row items-center justify-between">
            <a href="{{ "/" | relLangURL }}" class="flex text-gray-100 transition duration-1000 ease-in-out group">
                <img src="{{ "/images/global/logo_CAUS.webp" | relURL }}" class="transition-opacity h-9 w-9 group-hover:opacity-50 group-focus:opacity-70" alt="{{ site.Title }} Logo" />
                <span class="mt-1 ml-3 text-xl font-black tracking-tight text-gray-100 uppercase transition-colors group-hover:text-gray-400/60">{{ site.Params.Title_Short }}</span>
            </a>
            <button id="menu-toggle" type="button" class="rounded-lg lg:hidden focus:outline-hidden focus:shadow-outline" aria-expanded="false" aria-controls="menuItems" aria-label="Main">
                {{ partial "components/svg.html" (dict "name" "menu" "class" "w-6 h-6" "id" "menu-icon-open") }}
                {{ partial "components/svg.html" (dict "name" "close" "class" "hidden w-6 h-6" "id" "menu-icon-close") }}
            </button>
        </div>
        <nav id="menuItems" class="flex-col grow hidden pb-4 lg:pb-0 lg:flex lg:justify-end lg:flex-row" aria-label="Main">
            <ul class="flex flex-col grow lg:flex-row lg:justify-end lg:items-center">
                {{ partial "layout/menu-items.html" site.Menus.main }}
                {{ partial "layout/lang-switcher.html" . }}
                {{ if not site.Params.Disable_theme_toggle }}
                <li class="flex items-center">
                    <button id="theme-toggle" type="button" class="flex grow justify-start lg:justify-center text-left lg:text-center px-4 py-2 mt-2 text-sm text-gray-400 rounded-lg lg:mt-0 lg:ml-2 hover:text-white hover:bg-primary-600 focus:outline-hidden transition-colors" aria-label="Cambiar tema">
                        {{ partial "components/svg.html" (dict "name" "moon" "class" "hidden w-5 h-5" "id" "theme-toggle-dark-icon") }}
                        {{ partial "components/svg.html" (dict "name" "sun" "class" "hidden w-5 h-5" "id" "theme-toggle-light-icon") }}
                    </button>
                </li>
                {{ end }}
            </ul>
        </nav>
    </div>
</header>
