{{ range . }}
<li class="flex">
  <a
    class="grow px-4 py-2 mt-2 text-sm font-semibold rounded-lg lg:mt-0 hover:text-white focus:text-white hover:bg-primary-600 focus:bg-primary-700 focus:outline-hidden focus:shadow-outline"
    href="{{ .URL | relLangURL }}"
    title="{{ .Title | default .Name }}"
  >
    {{ .Name }}
  </a>
</li>
{{ end }}
