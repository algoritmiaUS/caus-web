{{define "main"}}
<article>
  <header class="mt-4">
    <h1 class="py-16 text-5xl font-black text-center capitalize text-gray-900 dark:text-white">
      {{ .Title }}
    </h1>
  </header>
  <div class="max-w-6xl mx-auto mt-8 mb-2">
    <div class="px-6">
      {{ partial "components/featured-single.html" . }}
    </div>
  </div>
  {{ if eq .Section "resources" }}
  <div class="mx-auto max-w-7xl px-6 pt-6">
    <a href="{{ "/resources/" | relLangURL }}" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-primary-600 dark:text-gray-400 dark:hover:text-primary-400 transition-colors">
      ⬅ Volver a Recursos
    </a>
  </div>
  {{ end }}
  <div class="max-w-7xl px-6 pt-6 pb-16 mx-auto prose dark:prose-invert dark:text-white">
    {{.Content}}
  </div>
</article>
{{end}}
