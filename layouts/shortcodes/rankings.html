{{ $dataFile := .Get 0 }} <!-- Nombre del archivo YAML -->
{{ $data := index hugo.Data $dataFile }}

<div class="overflow-x-auto">
  <table class="table-auto w-full border-collapse border border-gray-300 dark:border-gray-700">
    <thead class="bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-200">
      <tr>
        <th class="border border-gray-300 dark:border-gray-700 px-4 py-2 text-left">Pos.</th>
        <th class="border border-gray-300 dark:border-gray-700 px-4 py-2 text-left">Participante</th>
        <th class="border border-gray-300 dark:border-gray-700 px-4 py-2 text-center">Ver Imagen</th>
      </tr>
    </thead>
    <tbody class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-300">
      {{ range $data.participants }}
      <tr class="hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
        <td class="border border-gray-300 dark:border-gray-700 px-4 py-2">{{ .position }}</td>
        <td class="border border-gray-300 dark:border-gray-700 px-4 py-2">{{ .name }}</td>
        <td class="border border-gray-300 dark:border-gray-700 px-4 py-2 text-center">
          <button 
            onclick="showModal('{{ strings.TrimPrefix "/" .image | absURL }}')"
            class="text-blue-500 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300 focus:outline-none"
          >
            {{ partial "svg.html" (dict "name" "camera") }}
          </button>
        </td>
      </tr>
      {{ end }}
    </tbody>
  </table>
</div>

<div id="myModal" class="modal">
  <div class="modal-content">
      <span class="close">&times;</span>
      <img id="modalImage" src="" alt="imagen del participante">
  </div>
</div>

<script>
  var modal = document.getElementById("myModal");
  var modalImage = document.getElementById("modalImage");
  var span = document.getElementsByClassName("close")[0];

  function showModal(imageSrc) {
      modalImage.src = imageSrc;
      modal.style.display = "block";
  }

  span.onclick = function() {
      modal.style.display = "none";
  }

  window.onclick = function(event) {
      if (event.target == modal) {
          modal.style.display = "none";
      }
  }
</script>
