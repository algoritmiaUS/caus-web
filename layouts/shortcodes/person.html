<div class="flex flex-col items-center text-center p-4 rounded w-full max-w-[240px]">
  <img
    src="{{ .Get "image" }}"
    alt="{{ .Get "name" }}"
    width="200"
    height="200"
    loading="lazy"
    decoding="async"
    class="size-50 shrink-0 rounded-full object-cover shadow-md bg-gray-100 mb-3 object-{{ .Get "focus" | default "center" }}"
  />
  <p class="font-semibold text-sm truncate w-full">{{ .Get "name" }}</p>
  {{ with .Get "subtitle" }}
  <p class="text-xs text-slate-400 text-wrap text-center mt-1 leading-tight">{{ . }}</p>
  {{ end }}
</div>
