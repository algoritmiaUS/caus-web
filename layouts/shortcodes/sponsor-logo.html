{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $href := .Get "href" -}}
{{- $imgClass := .Get "class" | default "max-h-20 w-auto object-contain" -}}
{{- $style := .Get "style" -}}
<div class="not-prose my-6 flex justify-center rounded-2xl bg-paper p-6">
  {{- with $href -}}
    <a href="{{ . }}" class="flex justify-center"
      ><img
        src="{{ $src }}"
        alt="{{ $alt }}"
        class="{{ $imgClass }}"
        {{ with $style }}style="{{ . }}"{{ end }}
        loading="lazy"
    /></a>
  {{- else -}}
    <img
      src="{{ $src }}"
      alt="{{ $alt }}"
      class="{{ $imgClass }}"
      {{ with $style }}style="{{ . }}"{{ end }}
      loading="lazy"
    />
  {{- end -}}
</div>
