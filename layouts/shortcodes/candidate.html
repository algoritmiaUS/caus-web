<div
  class="not-prose flex flex-col md:flex-row gap-8 md:gap-10 p-6 bg-surface rounded-2xl border border-line/30 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300"
>
  <div
    class="flex flex-col items-center md:items-start text-center md:text-left flex-shrink-0 w-full md:w-48"
  >
    <img
      src="{{ .Get "image" }}"
      alt="{{ .Get "name" }}"
      width="128"
      height="128"
      loading="lazy"
      decoding="async"
      class="w-32 h-32 rounded-full object-cover shadow-md border-4 border-accent/20 mb-4 bg-wash"
    />
    <div class="flex flex-wrap justify-center md:justify-start">
      {{ range split (.Get "roles") "," }}
        <span class="mx-1 mt-1 px-2.5 py-0.5 text-xs font-semibold rounded-full border"
          >{{ trim . " " }}</span
        >
      {{ end }}
    </div>
  </div>
  <div class="flex-grow text-muted text-base leading-relaxed space-y-2">
    <h3 class="text-lg font-bold text-fg leading-tight">
      {{ .Get "name" }}
    </h3>
    {{ .Inner | markdownify }}
  </div>
</div>
