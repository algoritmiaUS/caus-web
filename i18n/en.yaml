mission.heading:
  other: "Our Mission"

mission.image_alt:
  other: "Participants of ComplicauS 5, the CAUS programming contest"

mission.description:
  other:
    "Our goal is to create a collaborative and inclusive community where members can learn, refine
    their programming skills, and tackle algorithmic challenges. Through problem-solving and
    competitions, we promote technical and professional growth, preparing students for academic,
    professional, and competitive challenges, while freely sharing knowledge so that everyone,
    regardless of their level, can learn and contribute."

challenge.heading:
  other: "Challenges, Community, and Fun at CAUS"

challenge.image_alt:
  other: "Climbing outing of the Algorithm Club"

challenge.description:
  other:
    "At the Algorithm Club of the University of Seville (CAUS), it’s not all about competitive
    programming. In addition to our talks and competitions, we organise social activities such as
    climbing outings and quarterly meals. We believe that balancing technical learning with
    enjoyment is key to both personal and professional growth. Join us and enjoy an environment
    where code and community go hand in hand!"

